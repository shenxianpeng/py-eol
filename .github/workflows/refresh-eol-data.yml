name: Refresh EOL Data
on:
  schedule:
    - cron: "0 0 * * *"  # Daily check
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - name: Install and Refresh EOL Data
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          py-eol refresh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          commit-message: "Refresh EOL data"
          branch: refresh-eol-data-${{ github.run_id }}
          title: "chore: refresh EOL data"
          body: "This PR refreshes the EOL data using the latest available information."
          labels: "auto-generated"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
