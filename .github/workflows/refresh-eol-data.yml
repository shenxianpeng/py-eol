name: Refresh EOL Data
on:
  schedule:
    - cron: "0 0 * * *"  # Daily check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install and Refresh EOL Data
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          py-eol refresh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "Refresh EOL data"
          branch: refresh-eol-data-${{ github.run_id }}
          title: "chore: refresh EOL data"
          body: "This PR refreshes the EOL data using the latest available information."
          labels: "auto-generated"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
