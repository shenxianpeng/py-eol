name: Refresh EOL Data
on:
  schedule:
    - cron: "0 0 * * *"  # Daily check
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install and Refresh EOL Data
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          py-eol refresh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "Refresh EOL data"
          branch: refresh-eol-data-${{ github.run_id }}
          title: "chore: refresh EOL data"
          body: "This PR refreshes the EOL data using the latest available information."
          labels: "auto-generated"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
