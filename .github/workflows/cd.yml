name: CD

on:
  release:
    branches: [main]
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # use fetch --all for setuptools_scm to work
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: python -m pip install nox
    - name: Build
      run: nox -s build
    - name: Publish to PyPI
      if: github.repository == 'shenxianpeng/py-eol'
      run: nox -s publish -- --username __token__ --password ${{ secrets.PYPI_TOKEN }}
