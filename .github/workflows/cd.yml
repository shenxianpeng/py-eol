name: CD

on:
  release:
    branches: [main]
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # use fetch --all for setuptools_scm to work
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: python -m pip install nox
    - name: Build
      run: nox -s build
    - name: Publish to PyPI
      if: github.repository == 'shenxianpeng/py-eol'
      run: nox -s publish -- --username __token__ --password ${{ secrets.PYPI_TOKEN }}
