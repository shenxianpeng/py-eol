name: CD

on:
  release:
    branches: [main]
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # use fetch --all for setuptools_scm to work
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: python -m pip install nox
    - name: Build
      run: nox -s build
    - name: Publish to PyPI
      if: github.repository == 'shenxianpeng/py-eol'
      run: nox -s publish -- --username __token__ --password ${{ secrets.PYPI_TOKEN }}
